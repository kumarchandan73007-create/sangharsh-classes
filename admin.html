<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Sungharsh Classes</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/"><b class="logo">S</b><span><strong>Sungharsh Classes</strong><small>Content Management</small></span></a><a class="admin" href="/">← Student Site</a></header><main class="admin-main">
<section id="login" class="login-card"><span class="eyebrow">ADMIN ACCESS</span><h1>Welcome back 👋</h1><p>Upload and manage Class 8, 9 and 10 study material.</p><form id="loginForm"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn full">Login</button><div id="loginMsg"></div></form></section>
<section id="dash" class="hidden"><div class="dash-head"><div><span class="eyebrow">CONTENT DASHBOARD</span><h1>Manage Notes</h1></div><button id="logout" class="outline">Logout</button></div><div class="admin-grid"><form id="upload" class="panel"><h2>➕ Upload Study Material</h2><p class="muted">PDF only • maximum 25 MB</p><label>Title *<input name="title" placeholder="e.g. Mathematics Chapter 1 Notes" required></label><label>Chapter / Topic<input name="chapter" placeholder="Chapter name"></label><div class="two"><label>Class *<select name="className" required><option value="">Select</option><option>Class 8</option><option>Class 9</option><option>Class 10</option></select></label><label>Subject *<select name="subject" required><option value="">Select</option><option>Mathematics</option><option>Science</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>English</option><option>Hindi</option><option>Social Science</option><option>Other</option></select></label></div><label>Material Type<select name="type"><option>Notes</option><option>Important Questions</option><option>Objective Questions</option><option>Subjective Questions</option><option>Revision Sheet</option><option>Sample Paper</option></select></label><label>Description<textarea name="description" rows="3" placeholder="Short description for students"></textarea></label><label>PDF File *<input name="pdf" type="file" accept=".pdf,application/pdf" required></label><button class="btn full">Publish Note 🚀</button><div id="uploadMsg"></div></form>
<section class="panel"><div class="list-head"><div><h2>📚 Published Notes</h2><p class="muted">Your uploaded material.</p></div><span id="total" class="pill">0</span></div><div id="list"></div></section></div></section></main><script src="/admin.js"></script></body></html>
